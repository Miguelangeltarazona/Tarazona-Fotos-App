 name: Construir Tarazona Fotos APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto V2 rehecho
        run: |
          mkdir proyecto
          unzip Tarazona_Fotos_APK_V2_REHECHA.zip -d proyecto

      - name: Compilar APK
        working-directory: proyecto/apkwork
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarazona-Fotos-App-V2
          path: proyecto/apkwork/app/build/outputs/apk/debug/app-debug.apk
      - name: Compilar APK
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarazona-Fotos-App-V2
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
